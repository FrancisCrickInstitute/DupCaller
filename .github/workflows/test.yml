name: Build

on:
  push:
    branches: [main, dev, crick]
  pull_request:
    branches: [main, crick]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # setup.py's numpy/scipy pins require python >= 3.11.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install .

      - name: Smoke test
        run: DupCaller.py --help

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # setup.py's numpy/scipy pins require python >= 3.11.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install .[test]

      - name: Install tabix
        run: sudo apt-get update && sudo apt-get install -y tabix

      - name: Run unit tests
        run: pytest tests/unit/ -v

  mock-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up conda environment with pipeline dependencies
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          channels: bioconda,conda-forge
          channel-priority: strict

      # The aligner is solved in its own env, isolated from samtools/
      # gatk4's htslib chain (whose libdeflate/zlib pins keep shifting as
      # bioconda adds builds), and both envs' bin dirs go on PATH.
      - name: Install bwa-mem2, samtools, gatk4
        run: |
          conda create -y -n bwa_env bwa-mem2=2.3
          conda create -y -n pipeline_env samtools gatk4=4.3.0.0
          echo "$(conda info --base)/envs/bwa_env/bin" >> "$GITHUB_PATH"
          echo "$(conda info --base)/envs/pipeline_env/bin" >> "$GITHUB_PATH"

      - name: Install DupCaller
        run: pip install .[test]

      # The nextflow test runs in the mock-pipeline-nextflow job below.
      - name: Run mock end-to-end pipeline test (direct CLI)
        run: |
          pytest tests/mock_pipeline/ -v \
            --ignore=tests/mock_pipeline/test_mock_pipeline_nextflow.py

  # Stub runs: every run mode reaches its processes and bad parameters are
  # refused. No container is pulled.
  nextflow-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        env:
          NXF_VER: "26.04.6"
        run: |
          # The installer writes ./nextflow, which would collide with the
          # repo's nextflow/ directory.
          mkdir -p "$RUNNER_TEMP/nextflow-install"
          cd "$RUNNER_TEMP/nextflow-install"
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/

      - name: Run wiring and parameter tests
        run: |
          pip install pytest
          pytest tests/nextflow -v

  # The Nextflow test runs the DupCaller image built from this commit, not a
  # published one, so Dockerfile and source changes are tested before release.
  build-image:
    uses: ./.github/workflows/build-image.yml

  mock-pipeline-nextflow:
    needs: build-image
    strategy:
      fail-fast: false
      matrix:
        # manifest.nextflowVersion in nextflow/nextflow.config is >=26.04.0.
        nextflow-version: ["26.04.6"]
    uses: ./.github/workflows/nextflow-mock.yml
    with:
      image: dupcaller:ci
      image-artifact: dupcaller-image
      nextflow-version: ${{ matrix.nextflow-version }}
